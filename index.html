<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학급 학급화폐 및 동아리 통합 관리 시스템</title>
  
  <!-- 1. Supabase SDK (최상단 로드) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tailwind CSS & SheetJS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <div id="app" class="p-4 md:p-8 max-w-7xl mx-auto">
    <!-- 헤더 -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <div>
        <div class="flex items-center gap-3">
          <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900">🏦 학급 학급화폐 관리 시스템</h1>
          <span id="db-status" class="text-xs px-3 py-1 rounded-full font-semibold bg-yellow-100 text-yellow-800">
            연결 확인 중...
          </span>
        </div>
        <p class="text-sm text-slate-500 mt-1">학생들의 직업, 잔액, 거래 내역을 실시간 관리합니다.</p>
      </div>
      <div class="flex items-center gap-2 w-full md:w-auto">
        <button onclick="fetchData()" class="flex-1 md:flex-none bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition shadow-sm">
          🔄 데이터 새로고침
        </button>
      </div>
    </header>

    <!-- 탭 메뉴 -->
    <div class="flex border-b border-slate-200 mb-6 gap-2">
      <button onclick="switchTab('students')" id="tab-btn-students" class="tab-btn px-5 py-2.5 font-bold text-sm border-b-2 border-indigo-600 text-indigo-600 transition">
        👨‍🎓 학생 및 화폐 관리
      </button>
      <button onclick="switchTab('roles')" id="tab-btn-roles" class="tab-btn px-5 py-2.5 font-bold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition">
        💼 직업 관리
      </button>
      <button onclick="switchTab('history')" id="tab-btn-history" class="tab-btn px-5 py-2.5 font-bold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition">
        📜 거래 및 활동 내역
      </button>
    </div>

    <!-- 탭 1: 학생 및 화폐 관리 -->
    <div id="tab-students" class="tab-content space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- 학생 목록 -->
        <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-slate-800">학생 명단 (<span id="student-count">0</span>명)</h2>
            <button onclick="exportToExcel()" class="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold px-3 py-1.5 rounded-lg border border-emerald-200 transition">
              📥 엑셀 내보내기
            </button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-xs text-slate-500 uppercase font-semibold">
                  <th class="p-3">번호</th>
                  <th class="p-3">이름</th>
                  <th class="p-3">직업</th>
                  <th class="p-3">현재 잔액</th>
                  <th class="p-3 text-right">관리</th>
                </tr>
              </thead>
              <tbody id="student-list" class="divide-y divide-slate-100 text-sm">
                <tr><td colspan="5" class="p-6 text-center text-slate-400">데이터를 불러오는 중입니다...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 화폐 관리 & 학생 추가 -->
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-4">💰 화폐 지급 및 차감</h2>
            <form id="tx-form" onsubmit="handleTransaction(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">지급 대상</label>
                <select id="tx-target" class="w-full p-2.5 border rounded-xl text-sm bg-slate-50 focus:bg-white transition">
                  <option value="ALL">전체 학생</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">금액 (+지급 / -차감)</label>
                <input type="number" id="tx-amount" placeholder="예: 1000 또는 -500" required class="w-full p-2.5 border rounded-xl text-sm focus:bg-white transition">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">사유</label>
                <input type="text" id="tx-reason" placeholder="예: 주간 직업 월급" required class="w-full p-2.5 border rounded-xl text-sm focus:bg-white transition">
              </div>
              <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-xl text-sm font-semibold transition">
                학급화폐 적용
              </button>
            </form>
          </div>

          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-4">➕ 학생 등록</h2>
            <form onsubmit="handleAddStudent(event)" class="space-y-3">
              <div class="grid grid-cols-2 gap-2">
                <input type="number" id="new-std-num" placeholder="번호" required class="p-2.5 border rounded-xl text-sm">
                <input type="text" id="new-std-name" placeholder="이름" required class="p-2.5 border rounded-xl text-sm">
              </div>
              <button type="submit" class="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold py-2.5 rounded-xl text-sm transition">
                등록하기
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- 탭 2: 직업 관리 -->
    <div id="tab-roles" class="tab-content hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold text-slate-800 mb-4">💼 학급 직업 목록</h2>
          <div id="role-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold text-slate-800 mb-4">➕ 새 직업 추가</h2>
          <form onsubmit="handleAddRole(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">직업명</label>
              <input type="text" id="role-title" placeholder="예: 청소 담당" required class="w-full p-2.5 border rounded-xl text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">주급/월급</label>
              <input type="number" id="role-salary" placeholder="예: 500" required class="w-full p-2.5 border rounded-xl text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">역할 설명</label>
              <textarea id="role-desc" placeholder="직업 세부 내용" class="w-full p-2.5 border rounded-xl text-sm h-20"></textarea>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition">
              직업 등록
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- 탭 3: 거래 내역 -->
    <div id="tab-history" class="tab-content hidden space-y-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-800 mb-4">📜 거래 및 입출금 로그</h2>
        <div id="history-list" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <script>
    // Supabase 주소 및 키 연동
    const SUPABASE_URL = 'https://oxlmwkvbgxszuhguwxif.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94bG13a3ZiZ3hzenVoZ3V3eGlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjQ4NzYsImV4cCI6MjEwMzg0MDg3Nn0.91VC1LGKPe8MOWNbg5KfWXR5jAHZIyh4d4HXP8uz9_4';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let state = { students: [], roles: [], transactions: [] };

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => {
        el.classList.remove('border-indigo-600', 'text-indigo-600');
        el.classList.add('border-transparent', 'text-slate-500');
      });

      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-btn-${tabName}`);
      activeBtn.classList.add('border-indigo-600', 'text-indigo-600');
      activeBtn.classList.remove('border-transparent', 'text-slate-500');
    }

    async function fetchData() {
      const statusEl = document.getElementById('db-status');
      try {
        const [stdRes, roleRes, txRes] = await Promise.all([
          supabase.from('students').select('*').order('number', { ascending: true }),
          supabase.from('roles').select('*'),
          supabase.from('transactions').select('*').order('created_at', { ascending: false }).limit(30)
        ]);

        if (stdRes.error) throw stdRes.error;
        if (roleRes.error) throw roleRes.error;
        if (txRes.error) throw txRes.error;

        state.students = stdRes.data || [];
        state.roles = roleRes.data || [];
        state.transactions = txRes.data || [];

        renderAll();
        statusEl.className = "text-xs px-3 py-1 rounded-full font-semibold bg-emerald-100 text-emerald-800";
        statusEl.innerText = "DB 연결 완료";
      } catch (err) {
        console.error(err);
        statusEl.className = "text-xs px-3 py-1 rounded-full font-semibold bg-rose-100 text-rose-800";
        statusEl.innerText = "연결 오류";
      }
    }

    function renderAll() {
      renderStudents();
      renderRoles();
      renderHistory();
    }

    function renderStudents() {
      const listEl = document.getElementById('student-list');
      const selectEl = document.getElementById('tx-target');
      document.getElementById('student-count').innerText = state.students.length;

      selectEl.innerHTML = `<option value="ALL">전체 학생 (${state.students.length}명)</option>`;

      if (state.students.length === 0) {
        listEl.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">등록된 학생이 없습니다.</td></tr>`;
        return;
      }

      listEl.innerHTML = state.students.map(s => {
        const role = state.roles.find(r => r.id === s.role_id);
        selectEl.innerHTML += `<option value="${s.id}">${s.number}번 ${s.name}</option>`;

        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 font-semibold text-slate-600">${s.number}번</td>
            <td class="p-3 font-bold text-slate-800">${s.name}</td>
            <td class="p-3">
              <span class="text-xs px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 font-medium">
                ${role ? role.title : '직업 없음'}
              </span>
            </td>
            <td class="p-3 font-bold ${s.balance >= 0 ? 'text-emerald-600' : 'text-rose-600'}">
              ${s.balance ? s.balance.toLocaleString() : 0} 원
            </td>
            <td class="p-3 text-right">
              <button onclick="deleteStudent('${s.id}')" class="text-xs text-rose-500 hover:text-rose-700 font-medium transition">삭제</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderRoles() {
      const roleEl = document.getElementById('role-list');
      if (state.roles.length === 0) {
        roleEl.innerHTML = `<p class="text-slate-400 text-sm">등록된 직업이 없습니다.</p>`;
        return;
      }

      roleEl.innerHTML = state.roles.map(r => `
        <div class="p-4 border border-slate-200 rounded-xl bg-slate-50 flex justify-between items-start">
          <div>
            <h3 class="font-bold text-slate-800">${r.title}</h3>
            <p class="text-xs text-indigo-600 font-semibold mt-0.5">급여: ${r.salary ? r.salary.toLocaleString() : 0}원</p>
            <p class="text-xs text-slate-500 mt-2">${r.description || '설명 없음'}</p>
          </div>
          <button onclick="deleteRole('${r.id}')" class="text-xs text-rose-400 hover:text-rose-600">삭제</button>
        </div>
      `).join('');
    }

    function renderHistory() {
      const historyEl = document.getElementById('history-list');
      if (state.transactions.length === 0) {
        historyEl.innerHTML = `<p class="text-slate-400 text-sm text-center py-6">기록된 거래 내역이 없습니다.</p>`;
        return;
      }

      historyEl.innerHTML = state.transactions.map(t => `
        <div class="p-3.5 border rounded-xl bg-slate-50 flex justify-between items-center">
          <div>
            <span class="font-bold text-slate-800 text-sm">${t.student_name || '전체 학생'}</span>
            <span class="text-xs text-slate-400 ml-2">${t.reason}</span>
          </div>
          <div class="font-bold ${t.amount >= 0 ? 'text-emerald-600' : 'text-rose-600'} text-sm">
            ${t.amount > 0 ? '+' : ''}${t.amount ? t.amount.toLocaleString() : 0} 원
          </div>
        </div>
      `).join('');
    }

    // 학생 등록 함수 (보안 및 데이터 호환성 보장)
    async function handleAddStudent(e) {
      e.preventDefault();
      const numInput = document.getElementById('new-std-num').value;
      const nameInput = document.getElementById('new-std-name').value.trim();

      const num = parseInt(numInput, 10) || 0;

      if (!nameInput) {
        alert("학생 이름을 입력해 주세요.");
        return;
      }

      const { data, error } = await supabase.from('students').insert([{
        id: 'std_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        number: num,
        name: nameInput,
        balance: 0
      }]);

      if (error) {
        console.error("에러 메시지:", error);
        alert(`등록 실패! 원인: ${error.message}`);
      } else {
        alert("학생 등록 성공!");
        e.target.reset();
        fetchData();
      }
    }

    async function deleteStudent(id) {
      if (!confirm("해당 학생을 삭제하시겠습니까?")) return;
      const { error } = await supabase.from('students').delete().eq('id', id);
      if (error) alert("삭제 실패: " + error.message);
      else fetchData();
    }

    async function handleAddRole(e) {
      e.preventDefault();
      const title = document.getElementById('role-title').value.trim();
      const salary = parseInt(document.getElementById('role-salary').value, 10) || 0;
      const desc = document.getElementById('role-desc').value.trim();

      const { error } = await supabase.from('roles').insert([{
        id: 'role_' + Date.now(),
        title: title,
        salary: salary,
        description: desc
      }]);

      if (error) alert("직업 추가 실패: " + error.message);
      else {
        e.target.reset();
        fetchData();
      }
    }

    async function deleteRole(id) {
      if (!confirm("해당 직업을 삭제하시겠습니까?")) return;
      const { error } = await supabase.from('roles').delete().eq('id', id);
      if (error) alert("삭제 실패: " + error.message);
      else fetchData();
    }

    async function handleTransaction(e) {
      e.preventDefault();
      const target = document.getElementById('tx-target').value;
      const amount = parseInt(document.getElementById('tx-amount').value, 10);
      const reason = document.getElementById('tx-reason').value.trim();

      if (isNaN(amount)) return alert("금액을 정확히 입력해주세요.");

      try {
        if (target === "ALL") {
          for (const std of state.students) {
            const newBal = (std.balance || 0) + amount;
            await supabase.from('students').update({ balance: newBal }).eq('id', std.id);
          }
          await supabase.from('transactions').insert([{
            id: 'tx_' + Date.now(),
            student_name: '전체 학생',
            amount: amount,
            reason: reason,
            balance_after: 0
          }]);
        } else {
          const std = state.students.find(s => s.id === target);
          const newBal = (std.balance || 0) + amount;
          await supabase.from('students').update({ balance: newBal }).eq('id', std.id);
          await supabase.from('transactions').insert([{
            id: 'tx_' + Date.now(),
            student_id: std.id,
            student_name: std.name,
            amount: amount,
            reason: reason,
            balance_after: newBal
          }]);
        }

        alert("적용이 완료되었습니다.");
        document.getElementById('tx-form').reset();
        fetchData();
      } catch (err) {
        alert("처리 실패: " + err.message);
      }
    }

    function exportToExcel() {
      const data = state.students.map(s => ({
        '번호': s.number,
        '이름': s.name,
        '잔액': s.balance || 0
      }));
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "학생명단");
      XLSX.writeFile(wb, "학급화폐_학생명단.xlsx");
    }

    window.addEventListener('DOMContentLoaded', fetchData);
  </script>
</body>
</html>
